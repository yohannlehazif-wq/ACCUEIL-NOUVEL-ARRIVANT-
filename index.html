.brand-wrap{display:contents!important}.top>a,.brand-wrap>a{display:flex;align-items:center;justify-content:center;padding:14px 18px;background:#fff}.restev-logo{width:min(270px,100%);max-height:105px;object-fit:contain}

lid #138a68}.answer-level.partial{background:#fff5df;border-left:6px solid #F59B16}.answer-level.risk{background:#fff0f0;border-left:6px solid #c53b3b}.actif{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.actif div{background:#376DB4;color:white;border-radius:13px;padding:10px;text-align:center}.actif b{display:block;font-size:1.4rem;color:#fff}.sim-nav{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.sim-progress{height:10px;background:#dce7ec;border-radius:999px;overflow:hidden;margin:12px 0}.sim-progress span{display:block;height:100%;background:linear-gradient(90deg,#376DB4,#D12883);transition:width .25s}.debrief-question{background:#f4f8fb;border-radius:12px;padding:12px;margin-top:10px;font-weight:bold}@media(max-width:760px){.sim-grid,.observer-grid{grid-template-columns:1fr}.actif{grid-template-columns:1fr}.sim-timer{font-size:1.8rem}.observer-actions{flex-direction:column}}

.risk-image-wrap{position:relative}.risk-marker{position:absolute;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#D12883;color:#fff;border:3px solid #fff;font-weight:900;box-shadow:0 3px 12px rgba(0,0,0,.45);transform:translate(-50%,-50%);z-index:4}.risk-marker::after{content:attr(data-label);position:absolute;left:44px;top:50%;transform:translateY(-50%);width:max-content;max-width:240px;background:rgba(15,43,68,.94);color:#fff;padding:7px 9px;border-radius:8px;font-size:.78rem;font-weight:700;text-align:left}.risk-marker.hidden{display:none}.risk-btn small{display:block;margin-top:5px;color:#5e6f7c;font-weight:500}.visual-proof{background:#f2f7fb;border-left:5px solid #376DB4;border-radius:10px;padding:10px;margin-top:8px}.risk-answer b{display:block;margin-bottom:4px}.risk-answer .where{color:#D12883;font-weight:800}
